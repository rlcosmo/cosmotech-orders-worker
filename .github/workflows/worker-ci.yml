name: worker-ci
on:
  push:
    branches: [main]
    # Source changes build images; workflow-only fixes use a targeted dispatch.
    paths: [src/**, tests/**, requirements*.txt, .dockerignore, .github/workflows/worker-ci.yml]
  pull_request:
  workflow_dispatch:
    inputs:
      approved_run_id:
        description: Reuse a successful worker-ci image for proposal only; empty builds normally
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-build-scan:
    if: inputs.approved_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt ruff==0.17.3
      - run: ruff check src tests
      - run: python -m pytest tests/unit -q
      - run: docker build -f src/orders/runtime/Dockerfile.worker -t orders-worker:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: orders-worker:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - run: docker save orders-worker:${{ github.sha }} -o /tmp/orders-worker-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: orders-worker-image
          path: /tmp/orders-worker-image.tar
          retention-days: 2
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.approved_run_id == ''
    needs: test-build-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: orders-worker-image, path: /tmp}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
      - id: publish
        shell: bash
        run: |
          set -euo pipefail
          docker load -i /tmp/orders-worker-image.tar
          registry=414053644145.dkr.ecr.us-east-1.amazonaws.com
          repository=aws-eks-istio-lab-dev-orders-worker
          image="$registry/$repository:sha-$GITHUB_SHA"
          docker tag "orders-worker:$GITHUB_SHA" "$image"
          if ! aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=sha-$GITHUB_SHA" >/dev/null 2>&1; then
            docker push "$image"
          fi
          digest="$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=sha-$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          echo "image=$registry/$repository@$digest" >> "$GITHUB_OUTPUT"
          echo "$registry/$repository@$digest" > proposed-image.txt
      - uses: actions/upload-artifact@v4
        with: {name: proposed-gitops-image, path: proposed-image.txt}
  propose-gitops:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.approved_run_id != ''))
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify approved source run and immutable image
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.approved_run_id }}
          BUILT_IMAGE: ${{ needs.publish.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_RUN" ]]; then
            [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
            python3 - <<'CHECK'
          import json,os,pathlib
          run=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'source-run.json').read_text())
          assert run['conclusion']=='success' and run['head_branch']=='main'
          assert run['path']=='.github/workflows/worker-ci.yml' and run['event'] in ['push','workflow_dispatch']
          CHECK
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name proposed-gitops-image --dir "$RUNNER_TEMP/approved-image"
          fi
          python3 - <<'CHECK'
          import json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          if os.environ['SOURCE_RUN']:
              run=json.loads((root/'source-run.json').read_text())
              sha=run['head_sha']
              image=(root/'approved-image/proposed-image.txt').read_text().strip()
          else:
              sha=os.environ['GITHUB_SHA']
              image=os.environ['BUILT_IMAGE']
          assert re.fullmatch('[0-9a-f]{40}',sha)
          assert re.fullmatch(r'414053644145\.dkr\.ecr\.us-east-1\.amazonaws\.com/aws-eks-istio-lab-dev-orders-worker@sha256:[0-9a-f]{64}',image)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'sha={sha}\nimage={image}\n')
          CHECK
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.GITOPS_APP_ID || secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: rlcosmo
          repositories: cosmotech-gitops
          permission-contents: write
          permission-pull-requests: write
      - name: Verify installation token repository scope
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api installation/repositories > "$RUNNER_TEMP/app-repositories.json"
          python3 - <<'CHECK'
          import json,os,pathlib
          value=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'app-repositories.json').read_text())
          assert [r['full_name'] for r in value['repositories']]==['rlcosmo/cosmotech-gitops'], 'Unexpected repository token scope'
          assert value['total_count']==1
          print('Installation token limited to rlcosmo/cosmotech-gitops.')
          CHECK
          if gh api repos/rlcosmo/cosmotech-infrastructure-iac >/dev/null 2>&1; then
            echo 'Unexpected access to private infrastructure repository' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: rlcosmo/cosmotech-gitops
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - name: Propose immutable image through a DEV PR
        env:
          IMAGE: ${{ steps.verified.outputs.image }}
          SOURCE_SHA: ${{ steps.verified.outputs.sha }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="image/orders-worker-${SOURCE_SHA}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch -c "$branch" FETCH_HEAD
          else
            git switch -c "$branch"
          fi
          python3 - <<'CHECK'
          import json,os,pathlib
          p=pathlib.Path('gitops/apps/orders-worker/dev/deployment.json')
          value=json.loads(p.read_text())
          image,digest=os.environ['IMAGE'].split('@')
          value['spec']['template']['spec']['containers'][0]['image']=image+':sha-'+os.environ['SOURCE_SHA']+'@'+digest
          p.write_text(json.dumps(value,indent=2)+'\n')
          body=pathlib.Path(os.environ['RUNNER_TEMP'])/'gitops-pr-body.md'
          body.write_text('Promote Orders Worker DEV image from successful CI commit '+os.environ['SOURCE_SHA']+'.\n\nImage: `'+os.environ['IMAGE']+'`. Tests, build and scan passed before ECR publication.\n\nThe owner authorized this DEV image-only pilot without human approvals. DEV_AUTO_PROMOTE and the versioned DEV policy control automatic merge. Argo CD performs deployment; Actions never writes the EKS Deployment.\n')
          CHECK
          git config user.name 'cosmotech-automation[bot]'
          git config user.email 'cosmotech-automation@users.noreply.github.com'
          git add gitops/apps/orders-worker/dev/deployment.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(orders): propose image $SOURCE_SHA"
            git push origin "$branch"
          fi
          if ! gh pr view "$branch" --repo rlcosmo/cosmotech-gitops --json url --jq .url; then
            gh pr create --repo rlcosmo/cosmotech-gitops --base main --head "$branch" --title "chore(orders): promote $SOURCE_SHA" --body-file "$RUNNER_TEMP/gitops-pr-body.md"
          fi
      - name: Automatically merge only the authorized DEV image promotion
        if: vars.DEV_AUTO_PROMOTE == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_SHA: ${{ steps.verified.outputs.sha }}
          IMAGE: ${{ steps.verified.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          branch="image/orders-worker-${SOURCE_SHA}"
          gh pr view "$branch" --repo rlcosmo/cosmotech-gitops --json number,state,headRefOid > "$RUNNER_TEMP/promotion-pr.json"
          if [[ "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["state"])' "$RUNNER_TEMP/promotion-pr.json")" == MERGED ]]; then
            echo 'DEV promotion already merged; nothing to change.'
            exit 0
          fi
          read -r pr head < <(python3 -c 'import json,sys;p=json.load(open(sys.argv[1]));print(p["number"],p["headRefOid"])' "$RUNNER_TEMP/promotion-pr.json")
          [[ "$pr" =~ ^[0-9]+$ && "$head" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main "$head"
          git worktree add --detach "$RUNNER_TEMP/dev-validator" origin/main
          (cd "$RUNNER_TEMP/dev-validator" && python3 scripts/validate_dev_image.py --application orders-worker --base origin/main --head "$head" --expected-sha "$SOURCE_SHA" --expected-digest "${IMAGE#*@}")
          gh api --method PUT "repos/rlcosmo/cosmotech-gitops/pulls/$pr/merge" -f sha="$head" -f merge_method=squash -f commit_title="chore(dev): promote Orders Worker $SOURCE_SHA" --jq 'if .merged then .sha else error(.message) end'
