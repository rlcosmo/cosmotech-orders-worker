# Prepared cutover: requires the reviewed Kestra/SSM/signature activation.
name: worker-ci
permissions:
  contents: read
concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      with:
        role-to-assume: arn:aws:iam::414053644145:role/cosmotech-orders-worker-github-ecr
        aws-region: us-east-1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Show this real CI run in Kestra
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: python scripts/report_kestra.py --app orders-worker --stage tests --state running
    - run: python -m pip install -r requirements.txt ruff==0.17.3
    - run: python scripts/validate_deployment.py --application orders-worker
    - run: ruff check src tests
    - id: unit_tests
      run: python -m pytest tests/unit -q
    - name: Record tests and start image stage in Kestra
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: 'python scripts/report_kestra.py --app orders-worker --stage tests --state success

        python scripts/report_kestra.py --app orders-worker --stage build_scan --state running

        '
    - run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -f src/orders/runtime/Dockerfile.worker -t orders-worker:${{ github.sha }} .
    - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
      with:
        image-ref: orders-worker:${{ github.sha }}
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'
    - run: docker save orders-worker:${{ github.sha }} -o /tmp/orders-worker-image.tar
    - uses: actions/upload-artifact@v4
      with:
        name: orders-worker-image
        path: /tmp/orders-worker-image.tar
        retention-days: 2
    - name: Record the real test-build-scan outcome
      if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      env:
        TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
        JOB_STATE: ${{ job.status }}
      run: 'if [[ "$TEST_OUTCOME" == success ]]; then stage=build_scan; else stage=tests; fi

        python scripts/report_kestra.py --app orders-worker --stage "$stage" --state "$JOB_STATE"

        '
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-build-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: orders-worker-image
        path: /tmp
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.ECR_PUBLISH_ROLE_ARN }}
        aws-region: us-east-1
    - uses: aws-actions/amazon-ecr-login@v2
    - name: Record ECR publication start
      run: python scripts/report_kestra.py --app orders-worker --stage publish --state running
    - id: publish
      shell: bash
      run: "set -euo pipefail\ndocker load -i /tmp/orders-worker-image.tar\nregistry=414053644145.dkr.ecr.us-east-1.amazonaws.com\n\
        repository=aws-eks-istio-lab-dev-orders-worker\nimage=\"$registry/$repository:sha-$GITHUB_SHA\"\ndocker\
        \ tag \"orders-worker:$GITHUB_SHA\" \"$image\"\nif ! aws ecr describe-images --repository-name \"$repository\"\
        \ --image-ids \"imageTag=sha-$GITHUB_SHA\" >/dev/null 2>&1; then\n  docker push \"$image\"\nfi\ndigest=\"\
        $(aws ecr describe-images --repository-name \"$repository\" --image-ids \"imageTag=sha-$GITHUB_SHA\" --query\
        \ 'imageDetails[0].imageDigest' --output text)\"\necho \"image=$registry/$repository@$digest\" >> \"$GITHUB_OUTPUT\"\
        \necho \"$registry/$repository@$digest\" > proposed-image.txt\n"
    - uses: actions/upload-artifact@v4
      with:
        name: proposed-gitops-image
        path: proposed-image.txt
    - name: Record ECR publication outcome
      if: always()
      env:
        JOB_STATE: ${{ job.status }}
      run: python scripts/report_kestra.py --app orders-worker --stage publish --state "$JOB_STATE"
  request-promotion:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::414053644145:role/cosmotech-orders-worker-github-ecr
        aws-region: us-east-1
    - name: Request the single Kestra gate; no GitOps credential is available
      env:
        PROPOSED_IMAGE: ${{ needs.publish.outputs.image }}
      run: python scripts/request_promotion.py --service orders-worker --image "$PROPOSED_IMAGE"
'on':
  push:
    branches:
    - main
    paths:
    - deploy/**
    - scripts/validate_deployment.py
    - src/**
    - tests/**
    - requirements*.txt
    - .dockerignore
    - scripts/report_kestra.py
    - .github/workflows/worker-ci.yml
  pull_request: null
  workflow_dispatch: {}
